name: Sync fork main with upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'pekempy/AnyPS5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Hard-reset main to upstream main
        run: |
          git remote add upstream https://github.com/boykopovar/AnyPS5.git
          git fetch upstream main
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
